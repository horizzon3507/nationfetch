[package]
name = "nationfetch"
version = "0.2.0"
edition = "2024"
description = "Fetch country information in your terminal — a Rust take on countryfetch"
license = "MIT"
keywords = ["cli", "countries", "fetch"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
colored = "3"
dirs = "6"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
